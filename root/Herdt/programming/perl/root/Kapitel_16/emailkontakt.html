<html>
	<head>
		<meta http-equiv="content-type" content="text/html;charset=iso-8859-1">
		<title>Kontakt-Formular</title>
	</head>

	<body>
		<h3>Kontakt-Formular</font></h3>
		<p>Senden Sie uns eine Nachricht mit Ihrem Anliegen und wir melden uns bei Ihnen.</font></p>
		<form action="/cgi-bin/Kapitel_16/emailkontakt.cgi" method="post">
			<table>
				<tr>
					<td>Name:</font></td>
					<td><input type="text" name="name" size="40"></td>
				</tr>
				<tr>
					<td>E-Mail:</font></td>
					<td><input type="text" name="email" size="40"></td>
				</tr>
				<tr>
					<td>Betreff::</font></td>
					<td><input type="text" name="betreff" size="40"></td>
				</tr>
				<tr>
					<td>Nachricht:</font></td>
					<td><textarea name="text" cols="40" rows="6"></textarea></td>
				</tr>
				<tr>
					<td></td>
					<td><input type="submit" value="Senden"></td>
				</tr>
			</table>
		</form>
		<p></p>
	</body>

</html>
