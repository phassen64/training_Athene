<html>
	<head>
		<meta http-equiv="content-type" content="text/html;charset=iso-8859-1">
		<title>Kontakt-Formular</title>
	</head>

	<body bgcolor="#ffffff">
		<h3><font face="Arial,Helvetica,Geneva,Swiss,SunSans-Regular">Kontakt-Formular</font></h3>
		<p><font face="Arial,Helvetica,Geneva,Swiss,SunSans-Regular">Bitte teilen Sie uns Ihre Adresse oder E-Mail mit, damit wir Kontakt zu Ihnen aufnehmen k&ouml;nnen.</font></p>
		<form action="/cgi-bin/kontakt.cgi" method="post">
			<table border="0" cellpadding="0" cellspacing="2">
				<tr>
					<td><font face="Arial,Helvetica,Geneva,Swiss,SunSans-Regular">Vorname:</font></td>
					<td><input type="text" name="vorname" size="24"></td>
				</tr>
				<tr>
					<td><font face="Arial,Helvetica,Geneva,Swiss,SunSans-Regular">Name:</font></td>
					<td><input type="text" name="name" size="24"></td>
				</tr>
				<tr>
					<td><font face="Arial,Helvetica,Geneva,Swiss,SunSans-Regular">Strasse:</font></td>
					<td><input type="text" name="strasse" size="40"></td>
				</tr>
				<tr>
					<td><font face="Arial,Helvetica,Geneva,Swiss,SunSans-Regular">PLZ Ort:</font></td>
					<td><input type="text" name="ort" size="40"></td>
				</tr>
				<tr>
					<td><font face="Arial,Helvetica,Geneva,Swiss,SunSans-Regular">E-Mail:</font></td>
					<td><input type="text" name="email" size="40"></td>
				</tr>
				<tr>
					<td></td>
					<td bgcolor="#c5c5c5"><input type="submit" name="Speichern" value="Speichern"></td>
				</tr>
			</table>
		</form>
		<p></p>
	</body>

</html>
